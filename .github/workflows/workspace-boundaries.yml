name: workspace-boundaries

on:
  pull_request:
  push:
    branches:
      - 'reorg/**'

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run boundaries:test
      - run: bun run boundaries:check

  typechecks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build workspace declaration prerequisites
        run: |
          bun run --cwd packages/gateway-protocol build
          bun run --cwd packages/gateway-client build
          bun run --cwd packages/capability-gateway build
      - run: bun run typecheck
